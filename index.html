<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Property Tour - Luxury Homes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
  color: #333;
  overflow: hidden;
}

#canvas {
  display: block;
  width: 100%;
  height: 100vh;
}

.ui-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
}

header {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 100;
  color: white;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

header h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

header p {
  font-size: 14px;
  opacity: 0.8;
}

.controls {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 20px 30px;
  border-radius: 50px;
  text-align: center;
  pointer-events: auto;
  z-index: 100;
}

.controls p {
  font-size: 14px;
  margin: 5px 0;
}

.info-panel {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 300px;
  pointer-events: auto;
  z-index: 100;
}

.info-panel h3 {
  font-size: 18px;
  margin-bottom: 10px;
  color: #d4af37;
}

.info-panel p {
  font-size: 13px;
  line-height: 1.6;
  opacity: 0.9;
}

.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 18px;
  z-index: 200;
}
</style>
</head>
<body>

<div id="canvas"></div>
<div class="ui-overlay">
  <header>
    <h1>Luxury Estate 3D Tour</h1>
    <p>Interactive Virtual Walkthrough</p>
  </header>

  <div class="info-panel">
    <h3>Property Details</h3>
    <p><strong>Price:</strong> $1,250,000</p>
    <p><strong>Location:</strong> Luxury Hills, CA</p>
    <p><strong>Bedrooms:</strong> 4</p>
    <p><strong>Bathrooms:</strong> 3</p>
    <p><strong>Square Feet:</strong> 4,500</p>
  </div>

  <div class="controls">
    <p>🖱️ <strong>Drag to Look Around</strong></p>
    <p>📱 Touch & Drag on Mobile</p>
  </div>
</div>

<script>
// Set up scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 1000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowShadowMap;
document.getElementById('canvas').appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(50, 50, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.far = 500;
scene.add(sunLight);

// Ground
const groundGeometry = new THREE.PlaneGeometry(200, 200);
const groundMaterial = new THREE.MeshStandardMaterial({ 
  color: 0x2d5016,
  roughness: 0.8,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = true;
ground.receiveShadow = true;
scene.add(ground);

// Main house structure
const mainBody = new THREE.Group();

// House base
const houseGeometry = new THREE.BoxGeometry(30, 25, 40);
const houseMaterial = new THREE.MeshStandardMaterial({ 
  color: 0xf5f5dc,
  roughness: 0.6,
  metalness: 0.1
});
const houseBase = new THREE.Mesh(houseGeometry, houseMaterial);
houseBase.position.y = 12.5;
houseBase.castShadow = true;
houseBase.receiveShadow = true;
mainBody.add(houseBase);

// Roof
const roofGeometry = new THREE.ConeGeometry(25, 15, 4);
const roofMaterial = new THREE.MeshStandardMaterial({ 
  color: 0x8b4513,
  roughness: 0.8,
  metalness: 0
});
const roof = new THREE.Mesh(roofGeometry, roofMaterial);
roof.position.y = 37.5;
roof.castShadow = true;
roof.receiveShadow = true;
mainBody.add(roof);

// Windows
for (let i = 0; i < 3; i++) {
  const windowGeometry = new THREE.BoxGeometry(4, 4, 0.5);
  const windowMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x87ceeb,
    roughness: 0.1,
    metalness: 0.5
  });
  const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
  window1.position.set(-10 + i * 10, 20, -20);
  window1.castShadow = true;
  mainBody.add(window1);

  const window2 = new THREE.Mesh(windowGeometry, windowMaterial);
  window2.position.set(-10 + i * 10, 20, 20);
  window2.castShadow = true;
  mainBody.add(window2);
}

// Door
const doorGeometry = new THREE.BoxGeometry(4, 8, 0.5);
const doorMaterial = new THREE.MeshStandardMaterial({ 
  color: 0x8b4513,
  roughness: 0.6,
  metalness: 0
});
const door = new THREE.Mesh(doorGeometry, doorMaterial);
door.position.set(0, 4, -20);
door.castShadow = true;
mainBody.add(door);

// Porch/Deck
const porchGeometry = new THREE.BoxGeometry(35, 1, 8);
const porchMaterial = new THREE.MeshStandardMaterial({ 
  color: 0xd4a574,
  roughness: 0.7,
  metalness: 0
});
const porch = new THREE.Mesh(porchGeometry, porchMaterial);
porch.position.set(0, 0.5, -24);
porch.castShadow = true;
porch.receiveShadow = true;
mainBody.add(porch);

// Pillars/Columns
for (let i = -15; i <= 15; i += 10) {
  const pillarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 12, 8);
  const pillarMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xffffff,
    roughness: 0.5,
    metalness: 0
  });
  const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
  pillar.position.set(i, 6, -24);
  pillar.castShadow = true;
  mainBody.add(pillar);
}

scene.add(mainBody);

// Trees for ambiance
function createTree(x, z) {
  const trunkGeometry = new THREE.CylinderGeometry(2, 2, 15, 8);
  const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x654321 });
  const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
  trunk.position.set(x, 7.5, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const foliageGeometry = new THREE.SphereGeometry(12, 8, 8);
  const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x228b22 });
  const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
  foliage.position.set(x, 25, z);
  foliage.castShadow = true;
  scene.add(foliage);
}

createTree(-40, -30);
createTree(40, -30);
createTree(-45, 30);
createTree(45, 30);

// Mouse controls for camera rotation
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

document.addEventListener('mousedown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;

    camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -deltaX * 0.005);
    camera.position.applyAxisAngle(camera.getWorldDirection(new THREE.Vector3()).cross(new THREE.Vector3(0, 1, 0)), -deltaY * 0.005);
    camera.lookAt(0, 10, 0);

    previousMousePosition = { x: e.clientX, y: e.clientY };
  }
});

document.addEventListener('mouseup', () => {
  isDragging = false;
});

// Touch controls
let touchStart = { x: 0, y: 0 };

document.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

document.addEventListener('touchmove', (e) => {
  const touchCurrent = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  const deltaX = touchCurrent.x - touchStart.x;
  const deltaY = touchCurrent.y - touchStart.y;

  camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -deltaX * 0.005);
  camera.position.applyAxisAngle(camera.getWorldDirection(new THREE.Vector3()).cross(new THREE.Vector3(0, 1, 0)), -deltaY * 0.005);
  camera.lookAt(0, 10, 0);

  touchStart = touchCurrent;
});

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Subtle animation
let time = 0;
function animate() {
  time += 0.01;
  
  // Gentle floating animation
  mainBody.position.y = Math.sin(time * 0.5) * 0.3;
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
